<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#003370">
  <title>Scan to Open Hardware &amp; Software AR</title>
  <link rel="stylesheet" href="game.css?v=3">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #00152f; background: #ffffff url("assets/hex-background.jpg") right top / cover no-repeat fixed; font-family: Montserrat, system-ui, sans-serif; }
    main { width: min(920px, 100%); padding: clamp(24px, 5vw, 46px); border: 2px solid #003370; border-radius: 28px; background: rgba(255,255,255,.96); text-align: center; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: #003370; font-weight: 700; }
    .brand img { width: 50px; }
    h1 { margin: 20px 0 8px; color: #003370; font-size: clamp(2rem, 6vw, 4.2rem); font-weight: 800; line-height: 1; }
    .lead { margin: 0 auto 20px; color: #003370; font-size: clamp(1.05rem, 2.5vw, 1.35rem); font-weight: 300; line-height: 1.45; }
    .qr { display: block; width: min(62vh, 560px, 88vw); height: auto; margin: 0 auto; }
    .steps { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px 20px; margin: 18px 0 0; color: #003370; font-weight: 700; }
    .steps span { white-space: nowrap; }
    .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
    a, button { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 0 18px; border: 2px solid #003370; border-radius: 13px; color: white; background: #003370; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    a { color: #003370; background: white; }
    .note { margin: 16px 0 0; color: #33506f; font-size: .92rem; }
    @media print {
      @page { size: A4 portrait; margin: 12mm; }
      body { min-height: auto; padding: 0; background: white; }
      main { width: 100%; padding: 10mm; border: 0; }
      .qr { width: 125mm; }
      .buttons, .note { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="assets/mindscape-mark.png" alt=""><span>Mindscape · Hardware &amp; Software</span></div>
    <h1>Scan to start</h1>
    <p class="lead">Open the camera on your tablet and point it at the QR code. No typing and no installation needed.</p>
    <img class="qr" src="assets/project-qr.png" alt="QR code that opens the Mindscape Hardware and Software AR activity">
    <div class="steps" aria-label="Instructions">
      <span>1. Open Camera</span>
      <span>2. Scan</span>
      <span>3. Tap the link</span>
    </div>
    <div class="buttons">
      <button type="button" onclick="window.print()">Print this page</button>
      <a href="assets/project-qr.png" download="Mindscape-Hardware-Software-AR-QR.png">Download QR</a>
      <a href="index.html">Open activity</a>
    </div>
    <p class="note">The QR opens https://yarar3.github.io/hardware-software-ar/ directly.</p>
  </main>
</body>
</html>
